name: CI

# 每次推 main / 提 PR：格式检查、vet、编译、Go 测试、Web UI 测试。
# 发布走 release.yml（推 v* tag）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: 编译与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查格式（gofmt）
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化，请跑 gofmt -w"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: 编译
        run: go build ./...

      - name: 测试
        run: go test ./...

  webui:
    name: Web UI 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行 node:test
        run: node --test server/webui/test/*.test.mjs
