# Personal File Manager / FS-Server example config

schema:
  addr: 127.0.0.1
  port: 10999

cors:
  allow_origins:
    - "*"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - HEAD
  allow_headers:
    - "*"

log:
  filename: logs/log.log
  level: debug
  max_size: 10
  max_age: 7
  max_backups: 10
  local_time: true
  compress: false

db:
  type: sqlite3
  addr: ""
  port: 0
  name: data.db
  user: ""
  password: ""
  table_prefix: ""

# 服务对外可访问地址，用于生成公开分享链接等场景
server_url: http://127.0.0.1:10999

aria2:
  endpoint: http://127.0.0.1:6800/jsonrpc
  token: ""
  timeout: 30

# 分享链接签名密钥。
# 建议设置为稳定且足够随机的字符串，否则更换后旧分享链接会失效。
sign_token: replace-with-a-stable-secret
auth:
  local:
    jwt_secret: "replace-with-a-stable-secret"
    token_ttl_hours: 720

# 照片日期解析配置（相册备份按"年/月"归档 + migrate-photos CLI 共用）。
# 不配置时使用内置默认规则（见 README「照片日期解析规则」），规则为"整体替换"语义：
# 一旦配置 filename_rules，默认表不再生效，请完整列出所有期望的前缀规则。
# 修改后无需重新部署前端：前端相册备份前会拉取本配置，失败回退内置默认。
photo_date:
  # EXIF DateTimeOriginal 是否启用（仅前端相册备份读取本地文件头，CLI 无本地文件）
  exif_enabled: true
  # EXIF 读取文件头上限（字节），默认 262144（256KB）
  exif_head_read_limit: 262144
  # 文件名解析规则（顺序敏感，先命中先返回）
  filename_rules:
    - type: prefix_segment_date # 前缀+下划线分隔取 segment_index 段，段内 YYYYMMDD 或 YYYY-MM-DD
      prefixes: ["IMG_", "Screenshot_", "PANO_", "VID_"]
      segment_index: 1
    - type: prefix_compact_date # 前缀后紧跟 8 位 YYYYMMDD
      prefixes: ["IMG"]
    - type: prefix_timestamp # 前缀后紧跟 10 位秒级时间戳
      prefixes: ["mmexport", "wx_camera_", "microMsg."]
    - type: leading_timestamp # 文件名开头连续数字，前 10 位为秒级时间戳
  # 时间戳防误判：年份下界（默认 2000）
  ts_min_year: 2000
  # 时间戳防误判：年份上界偏移（默认 1，即允许到当前年份+1）
  ts_max_year_offset: 1
