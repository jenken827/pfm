# Personal File Manager / FS-Server example config

schema:
  addr: 127.0.0.1
  port: 10999

cors:
  allow_origins:
    - "*"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - HEAD
  allow_headers:
    - "*"

log:
  filename: logs/log.log
  level: debug
  max_size: 10
  max_age: 7
  max_backups: 10
  local_time: true
  compress: false

db:
  type: sqlite3
  addr: ""
  port: 0
  name: data.db
  user: ""
  password: ""
  table_prefix: ""

# 服务对外可访问地址，用于生成公开分享链接等场景
server_url: http://127.0.0.1:10999

aria2:
  endpoint: http://127.0.0.1:6800/jsonrpc
  token: ""
  timeout: 30

# 分享链接签名密钥。
# 建议设置为稳定且足够随机的字符串，否则更换后旧分享链接会失效。
sign_token: replace-with-a-stable-secret
auth:
  local:
    # 必须改成稳定且足够随机的字符串（示例值不可用于生产）。
    # 更换后此前签发的 JWT 全部失效，所有用户需重新登录。
    jwt_secret: "replace-with-a-stable-secret"
    token_ttl_hours: 720

# 每 IP 限频（令牌桶，按客户端 IP 独立计量）。不配置即用下列默认值；
# 任一字段 <= 0 也回落默认值。缩略图走独立配额：一个目录几百张图一次性加载
# 属于正常用法，不应触发 429，也不该挤占文档预览 / 下载的额度。
ratelimit:
  # 同 IP + 同一路径：突发次数、每多少毫秒补 1 个令牌（10ms ≈ 100 次/秒）
  endpoint_burst: 120
  endpoint_refill_ms: 10
  # 同 IP 全部请求（缩略图除外）
  global_burst: 600
  global_refill_ms: 10
  # 缩略图（/api/file/stream/preview 且非 original=true）
  thumbnail_burst: 300
  thumbnail_refill_ms: 5

# 照片日期解析配置（相册备份按"年/月"归档 + migrate-photos CLI 共用）。
# 不配置时使用内置默认规则（见 README「照片日期解析规则」），规则为"整体替换"语义：
# 一旦配置 filename_rules，默认表不再生效，请完整列出所有期望的前缀规则。
# 修改后无需重新部署前端：前端相册备份前会拉取本配置，失败回退内置默认。
photo_date:
  # EXIF DateTimeOriginal 是否启用（仅前端相册备份读取本地文件头，CLI 无本地文件）
  exif_enabled: true
  # EXIF 读取文件头上限（字节），默认 262144（256KB）
  exif_head_read_limit: 262144
  # 文件名解析规则（顺序敏感，先命中先返回）
  filename_rules:
    - type: prefix_segment_date # 前缀+下划线分隔取 segment_index 段，段内 YYYYMMDD 或 YYYY-MM-DD
      prefixes: ["IMG_", "Screenshot_", "PANO_", "VID_"]
      segment_index: 1
    - type: prefix_compact_date # 前缀后紧跟 8 位 YYYYMMDD
      prefixes: ["IMG"]
    - type: prefix_timestamp # 前缀后紧跟 10 位秒级时间戳
      prefixes: ["mmexport", "wx_camera_", "microMsg."]
    - type: leading_timestamp # 文件名开头连续数字，前 10 位为秒级时间戳
  # 时间戳防误判：年份下界（默认 2000）
  ts_min_year: 2000
  # 时间戳防误判：年份上界偏移（默认 1，即允许到当前年份+1）
  ts_max_year_offset: 1

# 直链下载：让客户端绕开服务端中转，直接向存储提供者取字节（见 DESIGN.md §17）。
# 只有「单分片 + 未加密 + 驱动实现直链」的文件才会下发直链，其余一律走代理下载，
# 因此保持默认（开启）不会改变任何不满足条件文件的下载行为。
transfer:
  direct_link:
    # 是否启用，默认 true；设为 false = 完全停用直链（所有下载都走服务端代理）
    enabled: true
    # 允许直链的存储提供者类型白名单（如 BAIDU_NETDISK / PAN123 / ALIYUNDRIVE_OPEN /
    # YUN139 / CLOUD189_PC）；留空 = 所有实现了直链的驱动
    providers: []
    # 自动选源时是否优先挑可直链的提供者，默认 false（不改动现有 sort_order 优先级）
    prefer_directable_provider: false

# 缩略图尺寸（像素）。客户端用 GET /api/file/stream/preview?size=small|large 选档，
# 缓存文件名为 {hash}_{边长}.jpg；改尺寸后旧缓存不删，新尺寸在首次请求时按需生成。
# 不配即用默认值；<=0 回落默认，越界（<32 或 >4096）自动收敛。
thumbnail:
  small: 200 # 网格视图边长
  large: 400 # 全屏预览边长
