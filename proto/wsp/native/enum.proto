syntax = "proto3";

package native;

option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// StorageProviderType 存储提供者类型
enum StorageProviderType {
  PROVIDER_UNSPECIFIED = 0;
  LOCAL = 1;
  TELEGRAM = 2;
}

// FileType 文件类型
enum FileType {
  TYPE_UNSPECIFIED = 0;
  FOLDER = 1;
  IMAGE = 2;
  VIDEO = 3;
  AUDIO = 4;
  DOCUMENT = 5;
  ARCHIVE = 6;
  FONT = 7;
  APPLICATION = 8;
}

// HashType 哈希类型
enum HashType {
  HASH_TYPE_UNSPECIFIED = 0;
  MD5 = 1;
  SHA1 = 2;
  SHA256 = 3;
  SHA512 = 4;
  BLAKE2B = 5; //64位
  BLAKE2S = 6; //32位
  BLAKE3 = 7;
}

// 上传状态
enum UploadStatus {
  UPLOAD_TASK_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  HASHING = 2;  
  UPLOADING = 3;
  COMPLETED = 4;
  FAILED = 5;
  CANCELED = 6;
  PAUSED = 7;
}

// RespCode 应用状态码
enum RespCode {
  // 根据 protobuf 规范，枚举值必须从 0 开始，且建议后缀使用_UNSPECIFIED 表示未指定的状态，所以前端在处理时不要用 0 作为成功的状态码。
  CODE_UNSPECIFIED = 0;
  SUCCESS = 1;
  // 登录失效
  TOKEN_INVALID = 2;
  // 参数错误
  PARAMS_ERROR = 3;
  // 没有找到对应项
  ITEM_NOT_FOUND = 4;
  // 对象已存在
  ITEM_ALREADY_EXISTS = 5;
  // 权限不足
  PERMISSION_DENIED = 6;
  // 内部错误
  INTERNAL_ERROR = 7;
  // 自定义错误
  CUSTOM_ERROR = 8;
  // 请求频率过高
  RATE_LIMIT_EXCEEDED = 9;
  // 分片没有上传完整
  PARTIAL_UPLOAD_ERROR = 10;
}
