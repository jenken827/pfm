syntax = "proto3";

package native;

option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// StorageProviderType
// 存储提供者类型
enum StorageProviderType {
  PROVIDER_UNSPECIFIED = 0;
  LOCAL = 1;
  TELEGRAM = 2;
  DISCORD = 3;
  HUGGINGFACE = 4;
  PAN123 = 5;
}

// ConfigFieldType
// 配置字段类型
enum ConfigFieldType {
  CONFIG_FIELD_TYPE_UNSPECIFIED = 0;
  STRING = 1; // 字符串
  NUMBER = 2; // 数字
  BOOLEAN = 3; // 布尔值
  SELECT = 4; // 下拉选择
  STRING_LIST = 5; // 字符串列表
}

// FileType
// 文件类型，表中还同时存储了文件的mime类型
enum FileType {
  FILE_TYPE_UNKNOWN = 0;
  FOLDER = 1;
  IMAGE = 2;
  VIDEO = 3;
  AUDIO = 4;
  DOCUMENT = 5;
  ARCHIVE = 6;
  FONT = 7;
  APPLICATION = 8;
}

// HashType
enum HashType {
  HASH_TYPE_UNSPECIFIED = 0;
  MD5 = 1;
  SHA1 = 2;
  SHA256 = 3;
  SHA512 = 4;
  BLAKE2B = 5; //64 bit
  BLAKE2S = 6; //32 bit
  BLAKE3 = 7;
}

// UploadStatus used by client
enum UploadStatus {
  UPLOAD_TASK_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  HASHING = 2;  
  UPLOADING = 3;
  COMPLETED = 4;
  FAILED = 5;
  CANCELED = 6;
  PAUSED = 7;
}

// LocationStatus
// After the file is uploaded to our server, it still needs to be uploaded to the storage provider's server.
// This field represents the status of the file's upload to the storage provider's server.
enum LocationStatus {
  UPLOAD_PROVIDER_STATUS_UNSPECIFIED = 0;
  PPENDING = 1;
  PUPLOADING = 2;
  PCOMPLETED = 3;
  PFAILED = 4;
  PDELETED_FAILED = 5;
}

// UploadMethod
// enum UploadMethod {
//   UPLOAD_METHOD_UNSPECIFIED = 0;
//   // form data
//   FORM = 1;
//   // stream
//   STREAM = 2;
//   // chunk 
//   CHUNK = 3;
// }


// DownloadRecordState
// 下载记录状态
enum DownloadRecordState {
  DOWNLOAD_RECORD_STATE_UNSPECIFIED = 0;
  DOWNLOAD_PENDING = 1;
  DOWNLOADING = 2;
  DOWNLOAD_COMPLETED = 3;
  DOWNLOAD_FAILED = 4;
}

// UploadTaskType
// 上传任务类型
enum UploadTaskType {
  UPLOAD_TASK_TYPE_UNSPECIFIED = 0;
  // 普通上传任务：从客户端上传文件
  UPLOAD = 1;
  // 同步任务：文件已存在，同步到新的存储提供者
  SYNC = 2;
}

// SourceType
// 上传到存储提供者服务器时，源文件的来源
// 一般情况是从客户端上传到服务器，然后再上传到存储提供者服务器
// 如果一个文件已经上传过一次了（通过hash查询），那么就不需要再上传到服务器了
// 可以从已上传的存储提供者服务器下载下来，然后上传到需要的存储提供者服务器
// enum SourceType {
//   SOURCE_TYPE_UNSPECIFIED = 0;
//   CLIENT_UPLOAD = 1;
//   REMOTE_DOWNLOAD = 2;
// }

// RespCode response status code
enum RespCode {
  CODE_UNSPECIFIED = 0;
  SUCCESS = 1;
  TOKEN_INVALID = 2;
  PARAMS_ERROR = 3;
  NOT_FOUND = 4;
  ALREADY_EXISTS = 5;
  PERMISSION_DENIED = 6;
  INTERNAL_ERROR = 7;
  DB_ERROR = 8;
  RATE_LIMIT_EXCEEDED = 9;
  PARTIAL_UPLOAD_ERROR = 10;
}

// CacheStatus
// 缓存状态，仅 Telegram 存储提供者使用
// 当文件大于阈值时，需要先通过 bot-api 预缓存到本地，再进行下载
enum CacheStatus {
  CACHE_STATUS_UNSPECIFIED = 0;
  // 未缓存，需要通过 bot-api 预缓存
  UNCACHED = 1;
  // 缓存中，bot-api 正在缓存文件
  CACHING = 2;
  // 缓存完成，文件已缓存在本地，可直接读取
  CACHED = 3;
}

// ShareStatus 分享状态
enum ShareStatus {
  SHARE_STATUS_UNSPECIFIED = 0;
  // 活跃
  ACTIVE = 1;
  // 已取消
  CANCELLED = 2;
  // 已过期
  EXPIRED = 3;
}
