syntax = "proto3";

package native;

import "google/protobuf/timestamp.proto";
import "gorm/gorm.proto";
import "native/enum.proto";

option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// 下载记录
// aria2通知时，只会传递一个gid，此表记录了gid和关联的业务信息
message DownloadRecord {
  option (gorm.opts).ormable = true;
  optional uint32 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  // aria2 gid
  optional string gid = 4 [(gorm.field).tag = {
    unique_index: "idx_dr_gid"
    not_null: true
  }];
  // blake3 hash
  optional string blake3_hash = 5 [(gorm.field).tag = {
    index: "idx_dr_hash"
    not_null: true
  }];
  // 源文件位置记录ID（从哪个FileLocation下载）
  optional uint64 source_location_id = 6 [(gorm.field).tag = {not_null: true}];
  // 上传记录ID（关联的UploadRecord）
  optional uint32 upload_record_id = 7 [(gorm.field).tag = {index: "idx_dr_urid"}];
  // 下载状态
  optional DownloadRecordState state = 9 [(gorm.field).tag = {
    not_null: true
    default: "1"
  }];
  // aria2文件路径（下载完成后）
  optional string file_path = 10 [(gorm.field).tag = {default: "''"}];
  // 文件大小
  optional uint64 file_size = 11 [(gorm.field).tag = {default: "0"}];
  // 错误信息
  optional string error_message = 12 [(gorm.field).tag = {default: "''"}];
  // 下载完成后的回调信息（JSON格式，用于存储额外信息）
  optional string callback_info = 13 [(gorm.field).tag = {type: "text"}];
}
