syntax = "proto3";

package native;

import "google/protobuf/timestamp.proto";
import "gorm/gorm.proto";
import "native/enum.proto";

option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// File 文件信息
message File {
  option (gorm.opts).ormable = true;
  // 文件id，uuid格式
  optional string id = 1 [(gorm.field).tag = {primary_key: true}];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  optional google.protobuf.Timestamp deleted_at = 4 [(gorm.field).tag = {index: "idx_f_dt"}];
  // 文件名称
  optional string name = 5 [(gorm.field).tag = {index: "idx_f_nd,unique"}];
  // 所在文件夹路径
  optional string dir = 6 [(gorm.field).tag = {index: "idx_f_nd,unique"}];

  // 文件大小，以字节为单位
  optional uint64 size = 7 [(gorm.field).tag = {
    not_null: true
    default: "0"
  }];
  // 文件blake3哈希值，用于文件去重，这个值可能重复
  // 因为只是记录文件信息，并不会实际存储两份
  // 可能存在两个不同名但内容相同的文件
  optional string hash = 8 [(gorm.field).tag = {not_null: true,default: "''"}];
  // 文件类型
  optional FileType type = 9;
  // 文件MIME类型
  optional string mime = 10 [(gorm.field).tag = {not_null: true,default: "''"}];
  // 父文件id
  optional string parent_id = 11 [(gorm.field).tag = {index: "idx_f_pid"}];

  // 是否启用版本控制
  optional bool enable_version = 12 [(gorm.field).tag = {default: "false"}];
  // 最大历史版本数
  optional uint32 max_version = 13 [(gorm.field).tag = {default: "0"}];
}

// 文件夹配置。可扩展任意配置
// 目前只记录了加密信息，可以通过比对路径来判断文件是否在该文件夹下
// 比如，/a/b/c 文件夹配置了加密，上传的文件路径为/a/b/c/d/e/txt.txt，那么这个文件就需要加密
// 加密功能主要是为了防止网盘扫描，分析资源，但是有些文件是没必要加密的，
// 比如网站图标，网络视频资源等，如果把加密配置在存储层，就无法实现文件夹级别的控制，
// 所以，把加密功能配置在了文件夹级别，上传网盘的时候会根据文件夹配置来决定是否加密
// 存储类型为LOCAL的默认不加密
message DirConfig {
  option (gorm.opts).ormable = true;
  // 主键 ID
  optional uint64 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  optional google.protobuf.Timestamp deleted_at = 4 [(gorm.field).tag = {index: "idx_d_dt"}];
  optional string path = 5;
  // 文件 ID
  optional string file_id = 6 [(gorm.field).tag = {index: "idx_d_fid"}];
  optional bool enable_encryption = 7;
  // 加密密钥
  optional string encryption_key = 8;
  // 加密盐值
  optional string encryption_salt = 9;
  // 是否加密文件名
  optional bool encrypt_name = 10;
  // 加密后缀
  optional string encryption_suffix = 11;
}

// FileHistory 文件历史版本信息
message FileHistory {
  option (gorm.opts).ormable = true;
  // 主键 ID
  optional uint64 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];

  // 创建时间
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];

  // 关联的文件 ID
  optional string file_id = 3 [(gorm.field).tag = {index: "idx_fh_fid"}];

  // 使用上次更新时间作为版本号
  optional uint32 version_number = 4 [(gorm.field).tag = {index: "idx_fh_version"}];

  // 文件内容哈希（与 FileLocation.blake3_hash 对应）
  optional string content_hash = 5;

  // 文件大小
  optional uint64 size = 6;

  // MIME 类型
  optional string mime_type = 7;

  // 变更说明
  optional string change_log = 8;
}

// FileTag 文件标签
message FileTag {
  option (gorm.opts).ormable = true;
  optional uint64 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  // 文件id
  optional string file_id = 3 [(gorm.field).tag = {index: "idx_ft_fid"}];
  // 标签名称
  optional string tag_name = 4 [(gorm.field).tag = {index: "idx_ft_name"}];
}

// FileLocation 文件存储位置信息
// 这个表与File是通过blake3_hash和hash对应起来的，是多对多的关系
// 比如File中可能存储多个相同hash的文件，可能名称不同，位置不同
// 同样，这个表中也可能存储多个相同hash的文件，不是重复，是了安全，不同介质可能都存在副本
message FileLocation {
  option (gorm.opts).ormable = true;
  optional uint64 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  optional google.protobuf.Timestamp deleted_at = 4 [(gorm.field).tag = {index: "idx_fl_dt"}];
  // 文件blake3哈希值，
  optional string blake3_hash = 5 [(gorm.field).tag = {index: "idx_fl_bh, length:10"}];
  // 存储介质文件id
  optional string provider_file_id = 6;
  // 存储提供者类型
  optional StorageProviderType provider_type = 7;
  // 存储实例id，同一存储类型可能有多个实例
  optional uint32 provider_id = 8;
  // 文件在存储介质中的路径
  optional string path = 9;
  // 存储介质使用的哈希类型
  optional HashType hash_type = 10;
  // 文件在存储介质中的哈希值
  optional string hash = 11;
  // 文件过期时间
  optional google.protobuf.Timestamp expired_at = 12;
  // 分块编号
  optional uint32 chunk_number = 13;
  // 分块总数
  optional uint32 chunk_total = 14;
}

// StorageProvider 存储提供者实例
message StorageProvider {
  option (gorm.opts).ormable = true;
  optional uint32 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  optional google.protobuf.Timestamp deleted_at = 4 [(gorm.field).tag = {index: "idx_sp_dt"}];
  // 类型
  optional StorageProviderType provider_type = 5;
  // 实例名称
  optional string name = 6;
  // 实例描述
  optional string description = 7;
  // 实例配置
  optional string config = 8;
  // 所属组 id
  optional uint32 group_id = 9;
  // 总容量
  optional uint64 total_capacity = 10;
  // 剩余容量
  optional uint64 remaining_capacity = 11;
  // 是否启用
  optional bool enabled = 12;
  // 优先级
  optional uint32 order = 13;
}

// 存储组
// 一个存储组里面的实例会被看作一个整体，操作的时候会以组为单位
message StorageGroup {
  option (gorm.opts).ormable = true;
  optional uint32 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  optional google.protobuf.Timestamp deleted_at = 4 [(gorm.field).tag = {index: "idx_sg_dt"}];
  // 组名称
  optional string name = 5;
  // 组描述
  optional string description = 6;
  // 顺序
  optional uint32 order = 7;
}

// UploadRecord 文件上传记录
// 用于支持断点续传和大文件分片上传
message UploadRecord {
  option (gorm.opts).ormable = true;
  // 主键 ID
  optional string id = 1 [(gorm.field).tag = {
    primary_key: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];

  // 文件哈希（blake3，用于去重）
  optional string file_hash = 4 [(gorm.field).tag = {index: "idx_ur_fh"}];
  // 文件名
  optional string file_name = 5;
  // 文件大小（字节）
  optional uint64 file_size = 6;
  // 父目录ID
  optional string parent_id = 7 [(gorm.field).tag = {index: "idx_ur_pid"}];
  // 分片总数
  optional uint32 chunk_total = 8;
  // 分片大小（字节，默认10MB）
  optional uint64 chunk_size = 9;
  // 分片数据临时存储路径
  optional string temp_path = 10;
}
// 分片记录
message UploadChunkRecord {
  option (gorm.opts).ormable = true;
  optional uint32 id = 1 [(gorm.field).tag = {
    primary_key: true,
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  
  // 上传分片记录ID
  optional string upload_id = 4 [(gorm.field).tag = {index: "idx_ucr_uid"}];
  // 分片索引
  optional uint32 index = 5;
  // 分片hash
  optional string hash = 6;

}
