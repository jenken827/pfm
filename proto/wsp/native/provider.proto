syntax = "proto3";

package native;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "gorm/gorm.proto";
import "native/common.proto";
import "native/driver.proto";
import "native/enum.proto";

option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// StorageProvider 存储提供者
message StorageProvider {
  option (gorm.opts).ormable = true;

  optional uint32 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  optional google.protobuf.Timestamp deleted_at = 4 [(gorm.field).tag = {type: "deleted_at"}];

  // 类型
  optional StorageProviderType provider_type = 5 [
    (gorm.field).tag = {not_null: true},
    (buf.validate.field).required = true
  ];
  // 实例名称
  optional string name = 6 [
    (gorm.field).tag = {
      not_null: true
      unique_index: "idx_sp_n"
    },
    (buf.validate.field).required = true
  ];
  // 实例描述
  optional string description = 7;
  // 实例配置
  optional string config = 8 [
    (gorm.field).tag = {not_null: true},
    (buf.validate.field).required = true
  ];
  // 总容量
  optional uint64 total_capacity = 10 [(gorm.field).tag = {
    default: "0"
    not_null: true
  }];
  optional uint64 used_capacity = 11 [(gorm.field).tag = {
    default: "0"
    not_null: true
  }];
  // 是否启用
  optional bool enabled = 12 [(gorm.field).tag = {
    default: "true"
    not_null: true
  }];
  // 优先级
  optional uint32 order = 13 [(gorm.field).tag = {
    default: "0"
    not_null: true
  }];
  // 文件大小限制
  optional uint64 file_size_limit = 14 [(gorm.field).tag = {
    default: "0"
    not_null: true
  }];
  // 加密密钥
  optional string encryption_key = 15 [(gorm.field).tag = {
    not_null: true
    default: "''"
  }];
  // 是否加密文件名
  optional bool encrypt_filename = 16 [(gorm.field).tag = {
    not_null: true
    default: "false"
  }];
  // 加密后缀
  optional string encryption_suffix = 17 [(gorm.field).tag = {
    not_null: true
    default: "bin"
  }];
  // 存储提供者所提供的存储类型
  optional HashType hash_type = 18;
  // 是否为默认绑定的存储提供者
  optional bool default_bound = 19 [(gorm.field).tag = {
    not_null: true
    default: "false"
  }];
}

// StorageProviderGetReq 获取存储提供者请求
message StorageProviderGetReq {
  // 存储实例 ID
  optional uint32 id = 1;
}

// StorageProviderGetRespData 获取存储提供者详情响应
message StorageProviderGetRespData {
  StorageProvider detail = 1;
  // optional string group_name = 2;
}





// StorageProviderListRespData 获取存储提供者列表响应
message StorageProviderListRespData {
  repeated StorageProvider providers = 1;
}


// StorageProviderDeleteReq 删除存储提供者请求
message StorageProviderDeleteReq {
  // 存储实例 ID
  repeated uint32 ids = 1;
}

// // StorageProviderStatsReq 获取存储提供者统计信息请求
// message StorageProviderStatsReq {
//   optional uint32 id = 1;
// }

// StorageProviderStatsRespData 获取存储提供者统计信息响应
// message StorageProviderStatsRespData {
//   optional uint32                    file_count    = 1;         // 文件总数
//   optional uint64                    total_size    = 2;          // 总大小
//   optional uint32                    version_count = 3;       // 版本总数
//   optional google.protobuf.Timestamp last_used_at  = 4;  // 最后使用时间
// }

// ==================== Service Definition ====================

// StorageProviderService 存储提供者管理服务
service StorageProviderService {
  // 创建存储提供者
  rpc AddStorageProvider(StorageProvider) returns (BaseResp);

  // 获取存储提供者详情
  rpc GetStorageProvider(StorageProviderGetReq) returns (BaseResp);

  // 获取存储提供者列表
  rpc ListStorageProviders(google.protobuf.Empty) returns (BaseResp);

  // 更新存储提供者
  rpc UpdateStorageProvider(StorageProvider) returns (BaseResp);

  // 删除存储提供者
  rpc DeleteStorageProvider(StorageProviderDeleteReq) returns (BaseResp);

  // 获取存储提供者统计信息
  // rpc GetStorageProviderStats(StorageProviderStatsReq) returns (BaseResp);
}
