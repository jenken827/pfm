syntax = "proto3";

package native;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "native/common.proto";
import "native/driver.proto";
import "native/enum.proto";
import "sgorm/options.proto";

option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// StorageProvider 存储提供者
message StorageProvider {
  option (sgorm.opts).ormable = true;

  optional uint32 id = 1 [(sgorm.field).tag = {primary_key: true auto_increment: true}];
  optional google.protobuf.Timestamp created_at = 2 [(sgorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(sgorm.field).tag = {auto_update_time: true}];
  optional google.protobuf.Timestamp deleted_at = 4 [(sgorm.field).tag = {type: "deleted_at"}];

  // 驱动身份（稳定字符串，如 local / baidu / aliyundrive_open）
  //
  // 由驱动在注册或加载时声明，发布后不可更改：改了库里的 provider 就
  // 找不到驱动。规则见 driver/types.ValidateDriverID。
  optional string driver_id = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32,
    (sgorm.field).tag = {not_null: true, column: "provider_type"}
  ];
  // 实例名称
  optional string name = 6 [
    (buf.validate.field).required = true,
    (sgorm.field).tag = {not_null: true unique_index: "idx_sp_n"}
  ];
  // 实例描述
  optional string description = 7;
  // 实例配置
  optional string config = 8 [
    (buf.validate.field).required = true,
    (sgorm.field).tag = {not_null: true}
  ];
  // 总容量
  optional uint64 total_capacity = 9 [(sgorm.field).tag = {default: "0" not_null: true}];
  optional uint64 used_capacity = 10 [(sgorm.field).tag = {default: "0" not_null: true}];
  // 是否启用
  optional bool enabled = 11 [(sgorm.field).tag = {default: "true" not_null: true}];
  // 优先级（数字越小优先级越高）
  optional uint32 sort_order = 12 [(sgorm.field).tag = {default: "0" not_null: true}];
  // 文件大小限制
  optional uint64 file_size_limit = 13 [(sgorm.field).tag = {default: "0" not_null: true}];
  // 加密密钥
  optional string encryption_key = 14 [(sgorm.field).tag = {not_null: true default: "''"}];

  // 加密后缀
  optional string encryption_suffix = 15 [(sgorm.field).tag = {not_null: true default: "bin"}];
  // 存储提供者所提供的存储类型
  optional HashType hash_type = 16;
  // 是否为默认绑定的存储提供者
  optional bool default_bound = 17 [(sgorm.field).tag = {not_null: true default: "false"}];
  // 代理地址（如 http://127.0.0.1:7890 或 socks5://127.0.0.1:1080）
  optional string proxy = 18;
  // 最大并发上传数（0 表示使用全局默认值）
  optional uint32 max_concurrent_uploads = 19 [(sgorm.field).tag = {default: "0" not_null: true}];
}

// StorageProviderGetReq 获取存储提供者请求
message StorageProviderGetReq {
  // 存储实例 ID
  optional uint32 id = 1;
}

// StorageProviderGetRespData 获取存储提供者详情响应
message StorageProviderGetRespData {
  StorageProvider detail = 1;
  // optional string group_name = 2;
}





// StorageProviderListRespData 获取存储提供者列表响应
message StorageProviderListRespData {
  repeated StorageProvider providers = 1;
}

// ConfigField 配置字段定义
message ConfigField {
  // 字段名称（用于提交时的key）
  optional string name = 1;
  // 字段类型
  optional ConfigFieldType field_type = 2;
  // 显示标签
  optional string label = 3;
  // 占位提示
  optional string placeholder = 4;
  // 帮助文本
  optional string helper_text = 5;
  // 是否必填
  optional bool required = 6;
  // 默认值（JSON格式）
  optional string default_value = 7;
  // 验证规则（如正则表达式）
  optional string validation_pattern = 8;
  // 验证错误提示
  optional string validation_message = 9;
  // 下拉选项（用于SELECT类型）
  repeated ConfigSelectOption select_options = 10;
  // 图标名称（前端使用的图标标识）
  optional string icon_name = 11;
  // 输入类型（如password, text, number等）
  optional string input_type = 12;
  // 最大长度（用于字符串）
  optional int32 max_length = 13;
  // 最小值（用于数字）
  optional double min_value = 14;
  // 最大值（用于数字）
  optional double max_value = 15;
  // 多行文本行数（用于文本域）
  optional int32 multiline_rows = 16;
}

// ConfigSelectOption 下拉选择选项
message ConfigSelectOption {
  // 选项值
  string value = 1;
  // 显示文本
  string label = 2;
}

// DriverInfo 驱动元数据
message DriverInfo {
  // 驱动身份（稳定字符串）
  optional string driver_id = 1;
  // 类型名称
  optional string name = 2;
  // 显示名称
  optional string display_name = 3;
  // 描述
  optional string description = 4;
  // 图标名称
  optional string icon_name = 5;
  // 配置字段列表
  repeated ConfigField config_fields = 6;
  // 驱动声明的可选能力
  repeated DriverCapability capabilities = 7;
}

// GetStorageProviderTypesReq 获取存储提供者类型列表请求
message GetStorageProviderTypesReq {
  // 暂时不需要参数，预留扩展
}

// GetStorageProviderTypesRespData 获取存储提供者类型列表响应
message GetStorageProviderTypesRespData {
  repeated DriverInfo types = 1;
}


// StorageProviderDeleteReq 删除存储提供者请求
message StorageProviderDeleteReq {
  // 存储实例 ID
  repeated uint32 ids = 1;
}

// AddStorageProviderReq 创建存储提供者请求
message AddStorageProviderReq {
  // 驱动身份
  optional string driver_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  // 实例名称
  optional string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 100
  ];
  // 实例描述
  optional string description = 3;
  // 实例配置（JSON格式）
  optional string config = 4 [(buf.validate.field).required = true];
  // 是否启用
  optional bool enabled = 5;
  // 优先级（数字越小优先级越高）
  optional uint32 sort_order = 6;
  // 总容量（字节）
  optional uint64 total_capacity = 7;
  // 文件大小限制（字节）
  optional uint64 file_size_limit = 8;
  // 加密密钥
  optional string encryption_key = 9;
  // 是否加密文件名
  optional bool encrypt_filename = 10;
  // 加密后缀
  optional string encryption_suffix = 11;
  // 是否为默认绑定
  optional bool default_bound = 12;
  // 代理地址
  optional string proxy = 13;
  // 最大并发上传数（0 表示使用全局默认值）
  optional uint32 max_concurrent_uploads = 14;
}

// UpdateStorageProviderReq 更新存储提供者请求
message UpdateStorageProviderReq {
  // 存储实例 ID
  optional uint32 id = 1 [(buf.validate.field).required = true];
  // 实例名称
  optional string name = 2 [(buf.validate.field).string.min_len = 1];
  // 实例描述
  optional string description = 3;
  // 实例配置（JSON格式）
  optional string config = 4;
  // 是否启用
  optional bool enabled = 5;
  // 优先级（数字越小优先级越高）
  optional uint32 sort_order = 6;
  // 总容量（字节）
  optional uint64 total_capacity = 7;
  // 文件大小限制（字节）
  optional uint64 file_size_limit = 8;
  // 是否为默认绑定
  optional bool default_bound = 9;
  // 代理地址
  optional string proxy = 10;
  // 最大并发上传数（0 表示使用全局默认值）
  optional uint32 max_concurrent_uploads = 11;
}

