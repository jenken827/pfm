syntax="proto3";

package native;


option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// LocalDriverConfig 本地驱动器
message LocalDriverConfig {
    // 根路径
    optional string root_path=1;
    // 创建文件夹的权限
    optional string mkdir_permission=2;
}


// TelegramDriverConfig 电报驱动器
// 统一使用长轮询（getUpdates）接收更新，官方推荐轮询方式。
message TelegramDriverConfig {
    optional string bot_token=1;
    optional string bot_server=2;
    repeated string chat_id=3;
    // 本地 bot-api(--local 模式)返回的容器内文件路径前缀，例如 /var/lib/telegram-bot-api
    optional string local_path_prefix = 4;
    // 容器内路径前缀在宿主机上的实际路径（bind mount 目标），例如 /home/user/servers/telegram-bot-api/data
    optional string local_path_replacement = 5;
}

// 123pan 驱动器配置
message Pan123DriverConfig {
    optional string username = 1;
    optional string password = 2;
    optional string root_id = 3;
    optional string access_token = 4;
}

// 百度网盘驱动器配置
message BaiduNetdiskDriverConfig {
    optional string refresh_token = 1;
    optional string access_token = 2;
    optional string root_path = 3;
    optional string upload_thread = 4;
    optional int64 custom_upload_part_size = 5;
    optional string client_id = 6;
    optional string client_secret = 7;
}