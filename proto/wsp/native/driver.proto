syntax="proto3";

package native;


option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// LocalDriverConfig 本地驱动器
message LocalDriverConfig {
    // 根路径
    optional string root_path=1;
    // 创建文件夹的权限
    optional string mkdir_permission=2;
}


// TeleDriverConfig 电报驱动器
message TeleDriverConfig {
    optional string bot_token=1;
}
