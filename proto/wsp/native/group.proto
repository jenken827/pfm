syntax = "proto3";

package native;

import "google/protobuf/timestamp.proto";
import "native/common.proto";
import "native/tables.proto";
import "buf/validate/validate.proto";

option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// ==================== Request/Response Messages ====================

// StorageGroupAddReq 添加存储组请求
message StorageGroupAddReq {
  // 组名称
  optional string name = 1 [(buf.validate.field).required = true];
  // 组描述
  optional string description = 2;
}

// StorageGroupAddRespData 添加存储组响应
message StorageGroupAddRespData {
  optional uint32 id = 1;
}

// StorageGroupGetReq 获取存储组请求
message StorageGroupGetReq {
  // 组 ID
  optional uint32 id = 1 [(buf.validate.field).required = true];

}

// StorageGroupGetRespData 获取存储组详情响应数据
message StorageGroupGetRespData {
  optional uint32 id = 1;
  optional string name = 2;
  optional string description = 3;
  optional uint32 member_count = 4;
  repeated string member_name = 5;
  optional uint64 total_capacity = 6;
  optional uint64 remaining_capacity = 7;
  optional google.protobuf.Timestamp created_at = 8;
}


// StorageGroupListReq 获取存储组列表请求
message StorageGroupListReq {
  // 页码（从 1 开始）
  optional uint32 page = 1;
  // 每页数量
  optional uint32 page_size = 2;
  // 是否包含成员数量统计
  optional bool with_stats = 3;
  // 搜索关键词（匹配名称或描述）
  optional string keyword = 4;
  // 排序字段：created_at, updated_at, name
  optional string sort_by = 5;
  // 是否降序
  optional bool desc = 6;
}

// StorageGroupItem 存储组列表项
message StorageGroupItem {
  optional uint32 id = 1;
  optional string name = 2;
  optional string description = 3;
  optional uint32 member_count = 4;  // 成员数量
  optional uint64 total_capacity = 5; // 总容量
  optional uint64 remaining_capacity = 6; // 剩余容量
  optional google.protobuf.Timestamp created_at = 7;
}

// StorageGroupListRespData 获取存储组列表响应
message StorageGroupListRespData {
  repeated StorageGroupItem groups = 1;
  optional uint32 total = 2;  // 总数
}

// StorageGroupUpdateReq 更新存储组请求
message StorageGroupUpdateReq {
  // 组 ID
  optional uint32 id = 1;
  // 新名称（可选）
  optional string name = 2;
  // 新描述（可选）
  optional string description = 3;
}


// StorageGroupDeleteReq 删除存储组请求
message StorageGroupDeleteReq {
  // 组 ID
  optional uint32 id = 1 [(buf.validate.field).required = true];
  // 是否硬删除（默认 false，软删除）
  optional bool force = 2;
}

// ==================== Service Definition ====================

// StorageGroupService 存储组管理服务
service StorageGroupService {
  // 创建存储组
  rpc AddStorageGroup(StorageGroupAddReq) returns (BaseResp);
  
  // 获取存储组详情
  rpc GetStorageGroup(StorageGroupGetReq) returns (BaseResp);
  
  // 获取存储组列表
  rpc ListStorageGroups(StorageGroupListReq) returns (BaseResp);
  
  // 更新存储组
  rpc UpdateStorageGroup(StorageGroupUpdateReq) returns (BaseResp);
  
  // 删除存储组
  rpc DeleteStorageGroup(StorageGroupDeleteReq) returns (BaseResp);
}