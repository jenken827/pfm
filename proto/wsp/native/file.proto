syntax = "proto3";

package native;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "gorm/gorm.proto";
import "native/common.proto";
import "native/enum.proto";
import "native/provider.proto";

option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// File 文件信息
message File {
  option (gorm.opts).ormable = true;
  // 文件id
  optional string id = 1 [(gorm.field).tag = {
    primary_key: true
    not_null: true
    type: "char(36)"
  }];
  // ct,mt,dt 三件套
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  optional google.protobuf.Timestamp deleted_at = 4 [(gorm.field).tag = {type: "deleted_at"}];
  // 文件名称，与父id、owner_id组成唯一约束（同目录+同用户下不重名）
  optional string name = 5 [(gorm.field).tag = {
    not_null: true,
    index: "idx_f_npoi,length:10"
  }];
  // 父文件夹id
  optional string parent_id = 6 [(gorm.field).tag = {
    not_null: true,
    default: "0",
    index: "idx_f_npoi"
  }];
  // 文件大小，以字节为单位
  optional uint64 size = 7 [(gorm.field).tag = {
    not_null: true
    default: "0"
  }];
  // 文件blake3哈希值，这个值可以重复，相同内容的文件可以不同名或不同目录
  optional string hash = 8 [(gorm.field).tag = {
    not_null: true
    default: "''"
    index: "idx_f_hash,length:10"
  }];
  // 文件类型
  optional FileType type = 9 [(gorm.field).tag = {not_null: true, index: "idx_f_type"}];
  // 文件mime类型
  optional string mime = 10 [(gorm.field).tag = {
    not_null: true
    default: "''"
  }];
  // ----------------------下面的字段仅针对文件夹
  optional bool enable_encryption = 11 [(gorm.field).tag = {
    not_null: true
    default: "false"
  }];

  // 文件是否就绪（至少一个存储提供者上传成功）
  optional bool is_ready = 12 [(gorm.field).tag = {
    not_null: true
    default: "false"
  }];
  // 最大历史记录数（仅文件夹有效，0表示不保留历史）
  optional uint32 max_histories = 13 [(gorm.field).tag = {
    not_null: true
    default: "0"
  }];
  // 最后访问时间（用于"最近使用"功能）
  optional google.protobuf.Timestamp last_accessed_at = 14 [(gorm.field).tag = {
    index: "idx_f_laa"
  }];
  // 文件所有者（用户名/ID），用户只能操作 owner_id=自己的文件
  optional string owner_id = 15 [(gorm.field).tag = {
    not_null: true,
    default: "''",
    index: "idx_f_npoi,idx_f_owner,length:64"
  }];
  // 文件内容版本号（并发上传仲裁用）：每次内容被新 PUT 接管时递增，
  // 分发完成回调通过比对 version 判断自己是否仍是最新内容
  optional uint64 version = 16 [(gorm.field).tag = {
    not_null: true
    default: "0"
  }];
  // 绑定的存储提供者ID列表（JSON 数组，仅文件夹有效）。
  // 语义：'[]' = 未显式绑定（解析时沿祖先链向上继承，最终回退到 UserSpace.bound_provider_ids）；
  // 非空 = 该目录下文件只分发到这些 provider（必须 ⊆ 管理员分配给该用户的列表）
  optional string bound_provider_ids = 17 [(gorm.field).tag = {
    not_null: true
    default: "'[]'"
  }];
}
message FileHistory {
  option (gorm.opts).ormable = true;
  // 主键 ID
  optional uint64 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];

  // 创建时间
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];

  // 关联的文件 ID
  optional string file_id = 3 [(gorm.field).tag = {index: "idx_fh_fid,length:15"}];

  // 使用上次更新时间作为版本号
  optional google.protobuf.Timestamp version_number = 4 [(gorm.field).tag = {index: "idx_fh_version"}];

  // 文件内容哈希（与 FileLocation.blake3_hash 对应）
  optional string hash = 5 [(gorm.field).tag = {index: "idx_fh_hash, length:10"}];

  // 文件大小
  optional uint64 size = 6;


}

// FileTag 文件标签
message FileTag {
  option (gorm.opts).ormable = true;
  optional uint64 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  // 文件id
  optional string file_id = 3 [(gorm.field).tag = {
    not_null: true
    index: "idx_ft_fid, length:15"
  }];
  // 标签名称
  optional string tag_name = 4 [(gorm.field).tag = {
    not_null: true
    index: "idx_ft_name"
  }];
}

// FileLocation 文件存储位置信息
// 这个表与File是通过blake3_hash和hash对应起来的，是多对多的关系
// 比如File中可能存储多个相同hash的文件，可能名称不同，位置不同
// 同样，这个表中也可能存储多个相同hash的文件，不是重复，是为了安全，不同介质可能都存在副本
message FileLocation {
  option (gorm.opts).ormable = true;
  optional uint64 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  // optional google.protobuf.Timestamp deleted_at = 4 [(gorm.field).tag = {type: "deleted_at"}];
  // 文件blake3哈希值，
  optional string blake3_hash = 4 [(gorm.field).tag = {
    index: "idx_fl_bh, length:10"
    not_null: true
  }];
  // 存储介质文件id，可能不存在
  optional string provider_file_id = 5 [(gorm.field).tag = {
    not_null: true
    default: "''"
  }];

  // 存储实例id，同一存储类型可能有多个实例
  optional uint32 provider_id = 6 [(gorm.field).tag = {not_null: true}];
  // 文件在存储介质中的路径
  optional string path = 7 [(gorm.field).tag = {
    not_null: true
    default: "/"
  }];
  // 文件在存储介质中的哈希值
  optional string hash = 8 [(gorm.field).tag = {
    not_null: true
    default: "''"
  }];
  // 上传状态，文件一般会先上传到本地服务，然后再上传到存储介质的服务
  // 所以客户端虽然上传完成了，但是文件实际还未上传到存储介质，此时无法获取到下载链接
  optional LocationStatus status = 9;
  // 失败信息
  optional string message = 10;
  // 上传进度，百分比*1000, 也就是保留一位小数，比如543, 表示54.3%
  optional uint32 progress = 11;
  // 文件过期时间
  optional google.protobuf.Timestamp expired_at = 12;
  // 分块编号
  optional uint32 chunk_number = 13 [(gorm.field).tag = {
    not_null: true
    default: "0"
  }];
  // 分块总数
  optional uint32 chunk_total = 14 [(gorm.field).tag = {
    not_null: true
    default: "1"
  }];
  // 分块大小
  optional uint64 chunk_size = 15;
  // 分块hash
  optional string chunk_hash = 16;
  optional bool encrypted = 17;

  // 加密salt，随机生成的字符串
  optional string encryption_salt = 18 [(gorm.field).tag = {default: "''"}];

  // 文件在存储提供者上的实际存储大小（加密后）
  optional uint64 size = 19;
  // 缓存状态（仅 Telegram 使用，UNCACHED/CACHING/CACHED）
  optional CacheStatus cache_status = 20 [(gorm.field).tag = {
    not_null: true
    default: "0"
  }];
  // 仅123pan使用
  optional string s3_key_flag = 21;
  // 仅Telegram使用
  optional string channel_id = 22;
  // 仅Telegram使用
  optional int32 message_id = 23;

}

// 获取文件列表
message FileListReq {
  optional string parent_id = 1 [(buf.validate.field).required = true];
  // 每页数量，默认500
  optional uint32 page_size = 2;
  // 偏移量，从0开始
  optional uint32 offset = 3;
}

// 文件列表响应数据
message FileListRespData {
  repeated File files = 1;
  // 总数
  optional uint32 total = 2;
  // 是否有更多数据
  optional bool has_more = 3;
}

// 获取文件夹列表请求
message FolderListReq {
  optional string parent_id = 1 [(buf.validate.field).required = true];
}

// 文件夹列表响应数据
message FolderListRespData {
  repeated File folders = 1;
}

// 创建目录请求
message CreateDirReq {
  optional string name = 1 [(buf.validate.field).required = true];
  optional string parent_id = 2 [(buf.validate.field).required = true];
  optional bool enable_encryption = 3;
  // 最大历史记录数（0表示不限制）
  optional uint32 max_histories = 4;
  // 绑定的存储提供者ID列表：至少 1 个，且必须 ⊆ 管理员分配给当前用户的列表。
  // 不传 = 继承父文件夹的绑定（父文件夹未绑定则用管理员分配集）
  repeated uint32 provider_ids = 5;
}

// 创建目录响应数据
message CreateDirRespData {
  // 新创建的目录 ID
  optional string id = 1;
}

// ===== 相册备份专用：目录辅助 =====

// 获取有空位的编号子目录，都满则新建一个
// 语义：在 parent_id 下找「纯数字名称」且文件数未达上限的第一个目录；
// 若都满或不存在，则按最大编号 +1 新建（格式 001、002）。
message GetOrCreateSubfolderReq {
  // 父目录 ID
  optional string parent_id = 1 [(buf.validate.field).required = true];
}

message GetOrCreateSubfolderResp {
  // 可用于继续写入的目录 ID
  optional string folder_id = 1;
}

// 按相对路径逐级确保目录存在（mkdir -p 语义）
// 语义：rel_path 形如 "2026/07"，按 "/" 逐级查找/创建，返回叶子目录 ID。
// 幂等：重复调用返回同一目录；并发安全（唯一索引兜底）。
message EnsureDirPathReq {
  // 起始父目录 ID
  optional string parent_id = 1 [(buf.validate.field).required = true];
  // 相对路径（以 "/" 分隔的多级目录名）
  optional string path = 2 [(buf.validate.field).required = true];
}

message EnsureDirPathResp {
  // 路径末级目录 ID
  optional string folder_id = 1;
}

// 更新目录请求
message UpdateDirReq {
  optional string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 2
  ];
  optional string name = 2;
  optional bool enable_encryption = 3;
  // 最大历史记录数（0表示不限制）
  optional uint32 max_histories = 4;
  // 更新绑定的存储提供者ID列表：非空时必须 ⊆ 管理员分配给当前用户的列表；
  // 不传 = 绑定关系保持不变
  repeated uint32 provider_ids = 5;
}

// 删除文件请求
message DeleteFileReq {
  repeated string ids = 1 [(buf.validate.field).required = true];
}

// 文件重命名
message RenameFileReq {
  repeated RenameObj rename_objs = 1 [(buf.validate.field).required = true];
}

// 文件重命名数据结构
message RenameObj {
  optional string id = 1;
  optional string new_name = 2;
}

// 移动文件请求
message MoveFileReq {
  // 要移动的文件ID列表
  repeated string file_ids = 1 [(buf.validate.field).required = true];
  // 目标文件夹ID
  optional string target_parent_id = 2 [(buf.validate.field).required = true];
}

// 移动文件响应数据
message MoveFileRespData {
  // 成功移动的文件数量
  optional uint32 success_count = 1;
  // 失败的文件ID列表
  repeated string failed_ids = 2;
  // 失败原因（按文件ID索引）
  map<string, string> failed_reasons = 3;
}

// 文件详情请求
message FileDetailReq {
  optional string file_id = 1 [(buf.validate.field).required = true];
}

// 获取文件基本信息请求
message GetFileInfoReq {
  optional string file_id = 1 [(buf.validate.field).required = true];
}

// 文件基本信息响应
message GetFileInfoRespData {
  // 文件ID
  optional string id = 1;
  // 文件名称
  optional string name = 2;
  // 父文件夹ID
  optional string parent_id = 3;
  // 文件类型
  optional FileType type = 4;
  // 文件大小
  optional uint64 size = 5;
  // 绑定的存储提供者ID列表（JSON 数组，仅文件夹有效；'[]' = 未显式绑定）
  optional string bound_provider_ids = 6;
}

// 存储提供者位置信息（按提供者分组后）
message ProviderLocationInfo {
  // 存储提供者ID
  optional uint32 provider_id = 1;
  // 存储提供者名称
  optional string provider_name = 2;
  // 存储提供者类型
  optional StorageProviderType provider_type = 3;
  // 是否已加密
  optional bool encrypted = 4;
  // 是否分片存储
  optional bool is_chunked = 5;
  // 分片总数
  optional uint32 chunk_total = 6;
  // 上传状态
  optional LocationStatus status = 7;
  // 文件在存储提供者上的实际存储大小（加密后）
  optional uint64 size = 8;
  // 缓存状态（仅 Telegram 使用）
  optional CacheStatus cache_status = 9;
  // 存储路径
  optional string storage_path = 10;
}

// FileShare 文件分享记录
message FileShare {
  option (gorm.opts).ormable = true;
  optional uint64 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];
  optional google.protobuf.Timestamp deleted_at = 4 [(gorm.field).tag = {type: "deleted_at"}];
  // 分享码（短链标识，用于URL中，防止暴露文件ID）
  optional string share_code = 5 [(gorm.field).tag = {
    not_null: true
    index: "idx_fs_code, unique"
  }];
  // 文件ID
  optional string file_id = 6 [(gorm.field).tag = {
    not_null: true
    index: "idx_fs_fid"
  }];
  // 签名（HMAC-SHA256，防篡改）
  optional string sign = 7 [(gorm.field).tag = {not_null: true}];
  // 过期时间
  optional google.protobuf.Timestamp expire_at = 8;
  // 是否永久有效
  optional bool never_expire = 9 [(gorm.field).tag = {
    not_null: true
    default: "false"
  }];
  // 分享状态
  optional ShareStatus status = 10 [(gorm.field).tag = {not_null: true}];
  // 访问次数
  optional uint32 access_count = 11 [(gorm.field).tag = {
    not_null: true
    default: "0"
  }];
  // 最大访问次数（0=不限制）
  optional uint32 max_access_count = 12;
  // 备注
  optional string remark = 13;
  // 分享创建者（用户名/ID，冗余存储便于"我的分享"查询与归属校验）
  optional string owner_id = 14 [(gorm.field).tag = {
    index: "idx_fs_owner"
  }];
}

// 文件详情响应数据
message FileDetailRespData {
  // 文件信息
  optional File file = 1;
  // 存储位置分布
  repeated ProviderLocationInfo locations = 2;
  // 文件历史版本
  repeated FileHistory histories = 3;
  // 文件标签
  repeated string tags = 4;
}

// FileService文件服务
// 查询文件缓存状态请求
message GetFileCacheStatusReq {
  // 文件哈希
  optional string file_hash = 1 [(buf.validate.field).required = true];
  // 存储提供者ID
  optional uint32 provider_id = 2 [(buf.validate.field).required = true];
}

// 查询文件缓存状态响应
message GetFileCacheStatusResp {
  optional CacheStatus cache_status = 1;
  optional string message = 2;
  optional google.protobuf.Timestamp expired_at = 3;
  // 上传状态（如果文件还未上传完成）
  optional LocationStatus upload_status = 4;
  optional uint32 upload_progress = 5;
}

// 获取可用提供者请求
message GetAvailableProvidersReq {
  optional string file_hash = 1 [(buf.validate.field).required = true];
}

// 获取可用提供者响应
message GetAvailableProvidersResp {
  repeated StorageProvider providers = 1;
}

// 同步文件请求
message SyncFileToProvidersReq {
  optional string file_id = 1 [(buf.validate.field).required = true];
  repeated uint32 provider_ids = 2 [(buf.validate.field).required = true];
}

// 创建分享链接请求
message CreateShareLinkReq {
  // 文件ID
  optional string file_id = 1 [(buf.validate.field).required = true];
  // 过期时间（秒），默认604800（7天）
  optional int64 expire_seconds = 2;
  // 是否永久有效
  optional bool never_expire = 3;
  // 最大访问次数（0=不限制）
  optional uint32 max_access_count = 4;
  // 备注
  optional string remark = 5;
}

// 创建分享链接响应
message CreateShareLinkRespData {
  // 分享链接 URL
  optional string share_url = 1;
  // 分享码
  optional string share_code = 2;
  // 过期时间戳（Unix 时间戳，秒），null 表示永不过期
  optional int64 expire_at = 3;
}

// 取消分享链接请求
message CancelShareLinkReq {
  // 分享码
  optional string share_code = 1 [(buf.validate.field).required = true];
}

// 获取我的分享列表请求
message ListMySharesReq {
  // 每页数量，默认20
  optional uint32 page_size = 1;
  // 偏移量，从0开始
  optional uint32 offset = 2;
}

// 我的分享列表项（含分享对应文件的展示信息）
message MyShareItem {
  // 分享记录 ID
  optional uint64 id = 1;
  // 分享码
  optional string share_code = 2;
  // 分享链接 URL
  optional string share_url = 3;
  // 文件ID
  optional string file_id = 4;
  // 文件名称（文件可能已被删除，此时仅有历史快照信息）
  optional string file_name = 5;
  // 文件类型（文件夹/图片/视频等，用于前端图标展示）
  optional FileType file_type = 6;
  // 文件大小
  optional uint64 file_size = 7;
  // 文件是否已不存在（永久删除/从未找到），只读路径会失败
  optional bool file_missing = 8;
  // 文件是否在回收站（软删除）
  optional bool file_in_trash = 9;
  // 创建时间
  optional google.protobuf.Timestamp created_at = 10;
  // 过期时间
  optional google.protobuf.Timestamp expire_at = 11;
  // 是否永久有效
  optional bool never_expire = 12;
  // 分享状态
  optional ShareStatus status = 13;
  // 访问次数
  optional uint32 access_count = 14;
  // 最大访问次数（0=不限制）
  optional uint32 max_access_count = 15;
  // 备注
  optional string remark = 16;
}

// 获取我的分享列表响应
message ListMySharesRespData {
  repeated MyShareItem items = 1;
  // 总数
  optional uint32 total = 2;
  // 是否有更多数据
  optional bool has_more = 3;
}

// 更新分享链接请求
message UpdateShareLinkReq {
  // 分享码
  optional string share_code = 1 [(buf.validate.field).required = true];
  // 过期时间（秒），>0 时重新设置剩余有效期；传 0/不传则保持当前有效期（与 never_expire 配合可将永久改为限时）
  optional int64 expire_seconds = 2;
  // 是否改为永久有效：true=永久；false=限时（需配合 expire_seconds>0）
  optional bool never_expire = 3;
  // 最大访问次数（0=不限制），不传则保持
  optional uint32 max_access_count = 4;
  // 备注，不传则保持
  optional string remark = 5;
}

// 更新分享链接响应（sign 随有效期变化重签，需用新 URL 分享）
message UpdateShareLinkRespData {
  // 新的分享链接 URL
  optional string share_url = 1;
  // 分享码
  optional string share_code = 2;
  // 过期时间戳（Unix 时间戳，秒），null 表示永不过期
  optional int64 expire_at = 3;
}

// 从回收站恢复文件请求
message RestoreFromTrashReq {
  // 文件ID列表
  repeated string ids = 1 [(buf.validate.field).required = true];
  // 还原到的目标目录ID（可选，不填则还原到原位置）
  // 对于单个文件：还原到目标目录
  // 对于文件夹：还原到目标目录（文件夹内子文件保持原相对结构）
  optional string target_parent_id = 2;
}

// 彻底删除文件请求（从回收站永久删除）
message DeletePermanentlyReq {
  // 文件ID列表
  repeated string ids = 1 [(buf.validate.field).required = true];
}

// 清空回收站请求
message EmptyTrashReq {
  // 留空，清空所有回收站文件
}

// 获取回收站文件列表响应
message TrashListRespData {
  // 文件列表
  repeated File files = 1;
  // 总数
  optional uint32 total = 2;
}

// 删除文件历史版本请求
message DeleteFileHistoryReq {
  // 历史版本ID列表
  repeated uint64 ids = 1 [(buf.validate.field).required = true];
}

// 恢复文件历史版本请求
message RestoreFileHistoryReq {
  // 历史版本ID
  optional uint64 history_id = 1 [(buf.validate.field).required = true];
  // 恢复目标文件名（可选）：
  //  为空 → 覆盖当前文件（当前内容自动写入历史，不丢失）
  //  非空 → 以该名称在文件所在目录新建副本（不覆盖当前文件，重名自动加后缀）
  optional string new_name = 2;
}

// 搜索文件请求
message SearchFilesReq {
  // 搜索关键词（按文件名或标签模糊匹配）
  optional string keyword = 1 [(buf.validate.field).required = true];
  // 搜索类型：按文件名或按标签
  optional SearchType search_type = 2;
  // 偏移量，从0开始
  optional uint32 offset = 3;
  // 每页数量，默认50
  optional uint32 page_size = 4;
}

// 搜索文件响应数据
message SearchFilesRespData {
  repeated File files = 1;
  optional uint32 total = 2;
  optional bool has_more = 3;
}

// 更新文件标签请求
message UpdateFileTagsReq {
  // 文件ID
  optional string file_id = 1 [(buf.validate.field).required = true];
  // 标签列表
  repeated string tags = 2;
}

// 获取文件标签请求
message GetFileTagsReq {
  // 文件ID
  optional string file_id = 1 [(buf.validate.field).required = true];
}

// 获取文件标签响应数据
message GetFileTagsRespData {
  // 标签列表
  repeated string tags = 1;
}

// 获取最近使用的文件请求
message GetRecentFilesReq {
  // 每页数量，默认20
  optional uint32 page_size = 1;
  // 偏移量，从0开始
  optional uint32 offset = 2;
}

// 获取最近使用的文件响应数据
message GetRecentFilesRespData {
  repeated File files = 1;
  optional uint32 total = 2;
  optional bool has_more = 3;
}

// 按文件类型获取文件列表请求
message GetFilesByTypeReq {
  // 文件类型
  optional FileType file_type = 1 [(buf.validate.field).required = true];
  // 每页数量，默认50
  optional uint32 page_size = 2;
  // 偏移量，从0开始
  optional uint32 offset = 3;
}

// 按文件类型获取文件列表响应数据
message GetFilesByTypeRespData {
  repeated File files = 1;
  optional uint32 total = 2;
  optional bool has_more = 3;
}

// 传输服务配置
message GetTransferConfigReq {}

message GetTransferConfigResp {
  // 传输服务地址（上传/下载用），为空表示使用主服务地址
  optional string server_url = 1;
}

// 照片日期文件名解析规则（单条）
// type 取值范围（未知类型解析时跳过，保证前后端向前兼容）：
//   prefix_segment_date: 前缀+分隔符取 segment_index 段，段内按 YYYYMMDD 或 YYYY-MM-DD 解析
//                        例：IMG_20260811_063006.jpg / Screenshot_2018-12-31-xxx.jpg（前缀+下划线）
//   prefix_compact_date: 前缀后紧跟 8 位 YYYYMMDD
//                        例：IMG20150908xxx.jpg（前缀 IMG）
//   prefix_timestamp:    前缀后紧跟 10 位秒级时间戳
//                        例：mmexport1713701399029.jpg / wx_camera_1725958479520.jpg / microMsg.1713701399029.jpg
//   leading_timestamp:   文件名开头连续数字，前 10 位为秒级时间戳
//                        例：1784212534296.png
message PhotoDateFilenameRule {
  optional string type = 1;
  // 匹配前缀（prefix_segment_date / prefix_compact_date / prefix_timestamp 使用；
  // leading_timestamp 忽略此字段）
  repeated string prefixes = 2;
  // prefix_segment_date 专用：按分隔符切分后日期所在段的下标（从 0 开始）
  optional uint32 segment_index = 3;
}

// 照片日期解析配置（相册备份按"年/月"归档用）
// 服务端为权威源（config.photo_date），前端拉取并缓存，拉取失败回退内置默认
message PhotoDateConfig {
  // EXIF DateTimeOriginal 是否启用（仅前端相册备份有效，后端 migrate 无本地文件头）
  optional bool exif_enabled = 1;
  // EXIF 读取文件头上限（字节），默认 262144（256KB）
  optional uint32 exif_head_read_limit = 2;
  // 文件名解析规则（顺序敏感，先命中先返回；全部未命中则走媒体库时间兜底）
  repeated PhotoDateFilenameRule filename_rules = 3;
  // 时间戳防误判：解析年份下界，默认 2000
  optional uint32 ts_min_year = 4;
  // 时间戳防误判：允许的年份上界偏移（当前年份 + 偏移），默认 1
  optional uint32 ts_max_year_offset = 5;
}

// 获取照片日期解析配置请求
message GetPhotoDateConfigReq {}

// 获取文件直链请求
//
// 直链是存储提供者签发的、自带时效与鉴权的下载地址：满足条件（单分片、未加密、
// 驱动支持直链）时客户端可绕开服务端中转直接下载。不满足条件时返回
// RespCode.DIRECT_LINK_UNAVAILABLE，客户端应改用 fallback_url 走代理下载。
message DirectLinkFileReq {
  // 文件 ID
  optional string file_id = 1 [(buf.validate.field).required = true];
  // 指定存储提供者；不传则由服务端按现有优先级选源
  optional uint32 provider_id = 2;
}

// 获取文件直链响应数据
message DirectLinkFileRespData {
  // 提供者直链（临时凭证：不要落库、不要写日志、不要上报）
  optional string url = 1;
  // 客户端必须原样携带的请求头（如 User-Agent）；空表示 URL 自包含鉴权
  map<string, string> headers = 2;
  // 链接过期时间（驱动声明；可能为空表示未知）
  optional google.protobuf.Timestamp expires_at = 3;
  // 实际选中的存储提供者
  optional uint32 provider_id = 4;
  // 存储提供者类型
  optional StorageProviderType provider_type = 5;
  // 逻辑文件名（客户端落盘用；直链本身给不出这个名字）
  optional string file_name = 6;
  // 文件大小（字节）
  optional uint64 file_size = 7;
  // 提供者是否按 Range 下发（驱动声明；客户端仍应实测）
  optional bool supports_range = 8;
  // 回退地址（相对路径，直链不可用时改走服务端中转）
  optional string fallback_url = 9;
}

// 创建预览票据请求
//
// 预览票据是**单文件、短期**的签名凭证（默认 10 分钟），用于浏览器 / WebView
// 这类无法自定义请求头的场景：Flyfish Viewer 只能把凭证写在 URL 查询串里，
// 用 access token 会长期有效且能读该用户全部文件，票据则到期即失效且只对该
// 文件有效。签发要求调用方是文件所有者，票据绑定 file_id + user_id。
message CreatePreviewTicketReq {
  // 文件 ID
  optional string file_id = 1 [(buf.validate.field).required = true];
  // 用途：决定有效期（预览 10 分钟 / 下载 12 小时）；不传等价于 PREVIEW
  optional TicketPurpose purpose = 2;
}

// 创建预览票据响应数据
message CreatePreviewTicketRespData {
  // 票据（临时凭证：只在本次预览的 URL 里使用，不要落库、不要写日志）
  optional string ticket = 1;
  // 票据过期时间
  optional google.protobuf.Timestamp expires_at = 2;
}

// 文件服务
// 路由不再由 proto 注解声明，统一在 server/route_rest.go 中显式维护
service FileService {
  // 获取文件列表
  rpc GetFileList(FileListReq) returns (BaseResp);
  // 获取文件夹列表（用于移动文件选择目标文件夹）
  rpc GetFolderList(FolderListReq) returns (BaseResp);
  // 获取文件详情
  rpc GetFileDetail(FileDetailReq) returns (BaseResp);
  // 获取文件基本信息
  rpc GetFileInfo(GetFileInfoReq) returns (BaseResp);
  // 创建目录
  rpc CreateDir(CreateDirReq) returns (BaseResp);
  // 相册备份：获取有空位的编号子目录（都满则新建）
  rpc GetOrCreateSubfolder(GetOrCreateSubfolderReq) returns (BaseResp);
  // 相册备份：按相对路径逐级创建目录（mkdir -p 语义）
  rpc EnsureDirPath(EnsureDirPathReq) returns (BaseResp);
  // 更新目录
  rpc UpdateDir(UpdateDirReq) returns (BaseResp);
  // 删除文件
  rpc DeleteFile(DeleteFileReq) returns (BaseResp);
  // 文件重命名
  rpc RenameFile(RenameFileReq) returns (BaseResp);
  // 移动文件
  rpc MoveFile(MoveFileReq) returns (BaseResp);

  // 查询文件缓存状态（用于预下载任务）
  rpc GetFileCacheStatus(GetFileCacheStatusReq) returns (BaseResp);

  // 获取可用于同步的存储提供者列表
  rpc GetAvailableProvidersForSync(GetAvailableProvidersReq) returns (BaseResp);

  // 同步文件到指定存储提供者
  rpc SyncFileToProviders(SyncFileToProvidersReq) returns (BaseResp);

  // 创建分享链接
  rpc CreateShareLink(CreateShareLinkReq) returns (BaseResp);

  // 取消分享链接
  rpc CancelShareLink(CancelShareLinkReq) returns (BaseResp);

  // 获取我的分享列表（含文件状态，用于分享管理）
  rpc ListMyShares(ListMySharesReq) returns (BaseResp);

  // 更新分享链接（有效期/永久/访问上限/备注；有效期变更会重签 URL）
  rpc UpdateShareLink(UpdateShareLinkReq) returns (BaseResp);

  // 从回收站恢复文件
  rpc RestoreFromTrash(RestoreFromTrashReq) returns (BaseResp);

  // 彻底删除文件（从回收站永久删除）
  rpc DeletePermanently(DeletePermanentlyReq) returns (BaseResp);

  // 清空回收站
  rpc EmptyTrash(EmptyTrashReq) returns (BaseResp);

  // 获取回收站文件列表
  rpc GetTrashList(BaseResp) returns (BaseResp);

  // 删除文件历史版本
  rpc DeleteFileHistory(DeleteFileHistoryReq) returns (BaseResp);
  rpc RestoreFileHistory(RestoreFileHistoryReq) returns (BaseResp);

  // 更新文件标签
  rpc UpdateFileTags(UpdateFileTagsReq) returns (BaseResp);

  // 获取文件标签
  rpc GetFileTags(GetFileTagsReq) returns (BaseResp);

  // 搜索文件（按文件名模糊匹配）
  rpc SearchFiles(SearchFilesReq) returns (BaseResp);

  // 获取最近使用的文件
  rpc GetRecentFiles(GetRecentFilesReq) returns (BaseResp);

  // 按文件类型获取文件列表
  rpc GetFilesByType(GetFilesByTypeReq) returns (BaseResp);

  // 获取传输服务配置（上传/下载高带宽地址）
  rpc GetTransferConfig(GetTransferConfigReq) returns (BaseResp);

  // 获取照片日期解析配置（相册备份按年/月归档用）
  rpc GetPhotoDateConfig(GetPhotoDateConfigReq) returns (BaseResp);

  // 获取文件直链（满足条件时客户端可绕开服务端中转直连提供者）
  rpc GetFileDirectLink(DirectLinkFileReq) returns (BaseResp);

  // 创建单文件短期预览票据（替代把 access token 写进预览 URL）
  rpc CreatePreviewTicket(CreatePreviewTicketReq) returns (BaseResp);
}