syntax = "proto3";

package native;

import "google/api/annotations.proto";
import "native/common.proto";
import "native/enum.proto";
import "native/tables.proto";
import "buf/validate/validate.proto";

option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// 获取文件列表
message FileListReq {
  optional string parent_id = 1 [(buf.validate.field).required = true];
}

// 文件列表响应数据
message FileListRespData {
  repeated File files = 1;
  optional int64 total = 2;
}

// 创建目录请求
message CreateDirReq {
  optional string name = 1 [(buf.validate.field).required = true];
  optional bool enable_encryption = 2 [(buf.validate.field).required = true];
  optional string parent_id = 3 [(buf.validate.field).required = true];
  optional bool encrypt_name = 4;
  optional string encryption_suffix = 5;
  optional string encryption_key = 6;
  optional string encryption_salt = 7;
}


// 更新目录请求
message UpdateDirReq {
  optional string id = 1 [(buf.validate.field).required = true];

  optional string name = 2;

  optional bool enable_encryption = 3;

  optional bool encrypt_name = 4;

  optional string encryption_suffix = 5;

  optional string encryption_key = 6;

  optional string encryption_salt = 7;
}



// 删除文件请求
message DeleteFileReq {
  repeated string ids = 1 [(buf.validate.field).required = true];
}

// 文件重命名
message RenameFileReq {
  repeated RenameObj rename_objs = 1 [(buf.validate.field).required = true];
}

// 文件重命名数据结构
message RenameObj {
  optional string id = 1;
  optional string new_name = 2;
}

