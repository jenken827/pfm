syntax = "proto3";

package native;

import "buf/validate/validate.proto";
// import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "gorm/gorm.proto";
import "native/common.proto";
import "native/enum.proto";

option go_package = "jenken827.com/jenken827/pfm/proto/gen/native";

// UploadRecord
message UploadRecord {
  option (gorm.opts).ormable = true;
  optional uint32 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];

  // blake3 hash
  optional string file_hash = 4 [(gorm.field).tag = {unique_index: "idx_ur_fh, length:10"}];
  optional string file_name = 5 [(gorm.field).tag = {not_null: true}];
  // unit: byte
  optional uint64 file_size = 6 [(gorm.field).tag = {not_null: true}];

  optional string parent_id = 7 [(gorm.field).tag = {not_null: true}];
  optional uint32 chunk_total = 8 [(gorm.field).tag = {
    not_null: true
    default: "1"
  }];
  // unit: byte
  optional uint64 chunk_size = 9 [(gorm.field).tag = {
    not_null: true
    default: "0"
  }];
  optional string temp_path = 10 [(gorm.field).tag = {not_null: true}];
  optional string overwrite_id = 11 [(gorm.field).tag = {
    not_null: true
    default: "false"
  }];
  optional  UploadProviderStatus status = 12 [(gorm.field).tag = {not_null: true}];
  // 目标存储提供者ID列表（逗号分隔字符串）
  optional string target_provider_ids = 13 [(gorm.field).tag = {
    not_null: true
    default: "''"
  }];
}


//
message UploadChunkRecord {
  option (gorm.opts).ormable = true;
  optional uint32 id = 1 [(gorm.field).tag = {
    primary_key: true
    auto_increment: true
  }];
  optional google.protobuf.Timestamp created_at = 2 [(gorm.field).tag = {auto_create_time: true}];
  optional google.protobuf.Timestamp updated_at = 3 [(gorm.field).tag = {auto_update_time: true}];

  // 上传分片记录ID
  optional uint32 upload_id = 4 [(gorm.field).tag = {index: "idx_ucr_uid"}];
  // 分片索引
  optional uint32 index = 5 [(gorm.field).tag = {not_null: true}];
  // 分片hash
  optional string hash = 6 [(gorm.field).tag = {not_null: true}];
}

// 初始化上传请求
message InitUploadReq {
  optional string name = 1 [(buf.validate.field).required = true]; // 文件名
  optional string parent_id = 2 [(buf.validate.field).required = true]; // 父目录ID
  optional uint64 size = 3; // 文件大小
  // 文件完整哈希信息， BLAKE3
  optional string hash = 4 [(buf.validate.field).required = true];
  optional bool overwrite = 5;
}

// 初始化上传响应
message InitUploadRespData {
  optional uint32 upload_id = 1; // 上传任务ID
  optional bool exists = 2; // 文件是否已存在（秒传）
  optional bytes uploaded_chunks = 3; // 已上传分片的索引位图
  optional uint32 chunk_total = 4; // 分片总数
  optional uint64 chunk_size = 5; // 分片大小
}

// 上传分片请求（非流式，每次上传一个分片）
message UploadChunkReq {
  optional uint32 upload_id = 1 [(buf.validate.field).required = true];
  optional uint32 chunk_index = 2 [(buf.validate.field).required = true]; // 分片序号（从1开始）
  optional string chunk_hash = 3 [(buf.validate.field).required = true]; // 分片哈希（用于校验）
  optional bytes chunk = 4 [(buf.validate.field).required = true]; // 分片内容
}

// // 上传分片响应
// message UploadChunkRespData {
//   optional string upload_id = 1;
//   optional uint32 chunk_index = 2; // 已上传的分片序号
//   optional uint32 uploaded_count = 3; // 已上传分片数量
//   optional uint32 chunk_total = 4; // 分片总数
// }

// 完成上传请求
message CompleteUploadReq {
  optional uint32 upload_id = 1;
}

// // 完成上传响应
// message CompleteUploadRespData {
//   optional string file_id = 1; // 文件ID
//   optional string name = 2; // 文件名
//   optional uint64 size = 3; // 文件大小
// }

// 取消上传请求
message CancelUploadReq {
  optional uint32 upload_id = 1;
}

// 上传服务
service UploadService {
  // 初始化上传任务
  // 返回上传ID和已上传分片信息（支持断点续传）
  rpc InitUpload(InitUploadReq) returns (BaseResp);
  // 上传分片（非流式，每次上传一个分片）
  rpc UploadChunk(UploadChunkReq) returns (BaseResp);
  // 完成上传
  // 合并所有分片并创建文件记录
  rpc CompleteUpload(CompleteUploadReq) returns (BaseResp);

  // 取消上传
  // 删除临时分片文件
  rpc CancelUpload(CancelUploadReq) returns (BaseResp);
}
