version: v2
# 注意：配置为true会先删除目标目录下的所有文件，再进行生成，请确保目标目录为空，避免误删除
clean: true
plugins:
  # 仅生成数据结构（Go），传输层为 net/http REST，路由在 server/route_rest.go 中显式维护
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative

  # GORM 实体（含 gorm tag 与 ToPB/From 转换），由 proto 注解 sgorm.opts/sgorm.field 驱动
  # 与 pb 代码同在 proto/gen/（已 gitignore）：生成物不入库，克隆后跑一次 `bash dev.sh proto`
  - local: protoc-gen-sgorm
    out: gen/entity
    opt:
      - package=entity


inputs:
  - directory: wsp/
