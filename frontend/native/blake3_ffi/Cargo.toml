[package]
name = "pfm_blake3"
version = "0.1.0"
edition = "2021"
publish = false
description = "BLAKE3 C ABI for the PFM Flutter client (Dart FFI)"

[lib]
name = "pfm_blake3"
# cdylib 给 Flutter 端 dlopen；rlib 让 `cargo test` 能直接调内部实现
crate-type = ["cdylib", "rlib"]

[dependencies]
# rayon 让大块输入内部并行（BLAKE3 的树结构天然可并行），见 DESIGN.md §14.12.4
blake3 = { version = "1.5", features = ["rayon"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
