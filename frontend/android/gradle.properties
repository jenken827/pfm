org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 下面两条是 Flutter 3.47 模板带来的默认值，同机各 Flutter 项目保持一致（见 AGENTS.md §5）：
#   android.newDsl=false      —— 先不用 AGP 9 的新 DSL（关掉才认老的 android {} 写法）
#   android.builtInKotlin=false —— 不用 AGP 9 的「内置 Kotlin」；由 Flutter Gradle 插件
#                                 自己给 app 与各插件子项目应用 KGP（所以 app 的 plugins {}
#                                 里**不再写** id("kotlin-android")）
android.newDsl=false
android.builtInKotlin=false
