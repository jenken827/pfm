<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PFM 文件浏览</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #fff;
    --text: #1f2329;
    --muted: #8a9099;
    --line: #e5e7eb;
    --accent: #2563eb;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c; --card: #202227; --text: #e6e8eb;
      --muted: #9aa0a6; --line: #33363d; --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC",
          "Microsoft YaHei", sans-serif;
  }
  #app { max-width: 960px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  button {
    font: inherit; padding: 7px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  button.primary:hover { opacity: .9; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  input {
    font: inherit; width: 100%; padding: 9px 11px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field { margin-bottom: 12px; }
  .error { color: var(--danger); min-height: 20px; margin: 8px 0 0; }
  .muted { color: var(--muted); }

  /* 文件视图 */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  .crumb { display: flex; align-items: center; gap: 4px; flex: 1 1 240px; flex-wrap: wrap; }
  .crumb a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .crumb a:hover { text-decoration: underline; }
  .crumb span.sep { color: var(--muted); }
  .spacer { flex: 1; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.size, th.size { text-align: right; white-space: nowrap; }
  td.time, th.time { white-space: nowrap; color: var(--muted); }
  td.act, th.act { text-align: right; white-space: nowrap; }
  tr.file:hover, tr.dir:hover { background: rgba(127, 127, 127, .08); }
  tr.dir .name { cursor: pointer; }
  .icon { display: inline-block; width: 20px; }
  .name .label { word-break: break-all; }
  .badge { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .dl { color: var(--accent); text-decoration: none; }
  .dl:hover { text-decoration: underline; }
  .dl.disabled { color: var(--muted); pointer-events: none; }
  /* 复制直链用的是 span（不是 <a>）：直链只进剪贴板，不进 DOM / href / 历史记录 */
  .dl.click { cursor: pointer; }
  #status { color: var(--muted); padding: 8px 0; }
  #load-more { margin-top: 12px; width: 100%; }
  /* 注意：.overlay 用了 display:flex，会盖掉浏览器对 [hidden] 的默认 display:none */
  [hidden] { display: none !important; }

  /* 文件详情 / 选择下载源 */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .45);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 50;
  }
  .modal { width: 100%; max-width: 720px; max-height: 86vh; overflow: auto; }
  .modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .modal-head strong { flex: 1; word-break: break-all; }
  .section { margin-top: 18px; }
  .section > h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 500; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 0; }
  .meta dt { color: var(--muted); white-space: nowrap; }
  .meta dd { margin: 0; word-break: break-all; }
  .src {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .src .grow { flex: 1; min-width: 150px; word-break: break-all; }
  .src .sub { color: var(--muted); font-size: 12px; width: 100%; word-break: break-all; }
  .ok { color: #16a34a; }
  @media (max-width: 560px) {
    th.time, td.time { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- 登录 -->
  <section id="login-view" class="card" hidden>
    <h1>PFM 文件浏览</h1>
    <form id="login-form">
      <div class="field"><input id="username" placeholder="用户名" autocomplete="username" required></div>
      <div class="field"><input id="password" type="password" placeholder="密码" autocomplete="current-password" required></div>
      <button class="primary" type="submit" id="login-btn">登录</button>
    </form>
    <p id="login-error" class="error"></p>
    <p class="muted">使用服务端的本地账号登录（与 App 相同）。本页面只提供浏览与下载。</p>
  </section>

  <!-- 文件列表 -->
  <section id="files-view" class="card" hidden>
    <div class="toolbar">
      <nav id="breadcrumb" class="crumb"></nav>
      <div class="spacer"></div>
      <button id="refresh-btn">刷新</button>
      <button id="logout-btn">退出</button>
    </div>
    <div id="status"></div>
    <table>
      <thead>
        <tr>
          <th>名称</th>
          <th class="size">大小</th>
          <th class="time">修改时间</th>
          <th class="act"></th>
        </tr>
      </thead>
      <tbody id="file-rows"></tbody>
    </table>
    <button id="load-more" hidden>加载更多</button>
  </section>

  <!-- 文件详情：位置分布（按存储源下载）+ 历史版本 -->
  <div id="detail-overlay" class="overlay" hidden>
    <div class="modal card">
      <div class="modal-head">
        <strong id="detail-title">文件详情</strong>
        <button id="detail-close">关闭</button>
      </div>
      <div id="detail-body"></div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'pfm_web_token';
  var PAGE_SIZE = 500;

  var state = {
    token: localStorage.getItem(TOKEN_KEY) || '',
    rootId: '',
    stack: [],      // [{id, name}]，最后一项是当前目录
    offset: 0,
    total: 0,
    hasMore: false,
    loading: false
  };

  var $ = function (id) { return document.getElementById(id); };

  // ---------------------------------------------------------------- 工具
  function fmtSize(v) {
    var n = Number(v) || 0;
    if (n <= 0) return '-';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + ' ' + units[i];
  }

  function fmtTime(s) {
    if (!s) return '-';
    var d = new Date(s);
    if (isNaN(d.getTime())) return '-';
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function isDir(f) { return f.type === 'FOLDER'; }

  function iconFor(f) {
    if (isDir(f)) return '📁';
    switch (f.type) {
      case 'IMAGE': return '🖼️';
      case 'VIDEO': return '🎬';
      case 'AUDIO': return '🎵';
      case 'DOCUMENT': return '📄';
      case 'ARCHIVE': return '🗜️';
      case 'FONT': return '🔤';
      default: return '📦';
    }
  }

  function show(view) {
    $('login-view').hidden = view !== 'login';
    $('files-view').hidden = view !== 'files';
  }

  function setStatus(msg) { $('status').textContent = msg || ''; }

  // ---------------------------------------------------------------- 请求
  // 业务错误是 HTTP 200 + BaseResp.code != 0；鉴权失败才是 HTTP 401。
  function api(path, body) {
    var headers = { 'Content-Type': 'application/json' };
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    return fetch(path, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(body || {})
    }).then(function (res) {
      if (res.status === 401) { logout(true); throw new Error('登录已过期，请重新登录'); }
      return res.json().then(function (json) {
        if (!res.ok) throw new Error(json.message || ('HTTP ' + res.status));
        // 成功是 RespCode.SUCCESS（proto3 JSON 里是字符串 "SUCCESS"）；
        // TOKEN_INVALID 会以 HTTP 200 + code 返回，需按登录失效处理。
        if (json.code === 'TOKEN_INVALID') { logout(true); throw new Error('登录已过期，请重新登录'); }
        if (json.code !== 'SUCCESS' && json.code !== 1 && json.code !== undefined) {
          throw new Error(json.message || ('错误码 ' + json.code));
        }
        return json.data || {};
      });
    });
  }

  function login(username, password) {
    return fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    }).then(function (res) {
      if (res.status === 401) throw new Error('用户名或密码错误');
      if (!res.ok) throw new Error('登录失败（HTTP ' + res.status + '）');
      return res.json();
    }).then(function (data) {
      if (!data.token) throw new Error('登录响应缺少 token');
      state.token = data.token;
      localStorage.setItem(TOKEN_KEY, data.token);
      return data;
    });
  }

  function logout(silent) {
    state.token = '';
    state.rootId = '';
    state.stack = [];
    localStorage.removeItem(TOKEN_KEY);
    $('file-rows').innerHTML = '';
    setStatus('');
    closeDetail();
    show('login');
    if (!silent) $('login-error').textContent = '';
  }

  // ---------------------------------------------------------------- 渲染
  function renderBreadcrumb() {
    var nav = $('breadcrumb');
    nav.innerHTML = '';
    state.stack.forEach(function (node, i) {
      if (i > 0) {
        var sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '/';
        nav.appendChild(sep);
      }
      var a = document.createElement('a');
      a.textContent = node.name;
      a.onclick = function () { enterAt(i); };
      nav.appendChild(a);
    });
  }

  function renderRows(files) {
    var tbody = $('file-rows');
    var dirs = files.filter(isDir).sort(byName);
    var plain = files.filter(function (f) { return !isDir(f); }).sort(byName);

    dirs.concat(plain).forEach(function (f) {
      var tr = document.createElement('tr');
      tr.className = isDir(f) ? 'dir' : 'file';

      var tdName = document.createElement('td');
      tdName.className = 'name';
      var icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = iconFor(f);
      tdName.appendChild(icon);
      var label = document.createElement('span');
      label.className = 'label';
      label.textContent = f.name || '(未命名)';
      tdName.appendChild(label);
      if (f.isReady === false && !isDir(f)) {
        var badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '未就绪';
        tdName.appendChild(badge);
      }
      if (isDir(f)) {
        tdName.onclick = function () { enterDir(f); };
      } else {
        tdName.title = '查看详情 / 选择下载源';
        tdName.onclick = function () { openDetail(f); };
      }
      tr.appendChild(tdName);

      var tdSize = document.createElement('td');
      tdSize.className = 'size';
      tdSize.textContent = isDir(f) ? '-' : fmtSize(f.size);
      tr.appendChild(tdSize);

      var tdTime = document.createElement('td');
      tdTime.className = 'time';
      tdTime.textContent = fmtTime(f.updatedAt || f.createdAt);
      tr.appendChild(tdTime);

      var tdAct = document.createElement('td');
      tdAct.className = 'act';
      if (!isDir(f)) {
        var a = document.createElement('a');
        a.className = 'dl' + (f.isReady === false ? ' disabled' : '');
        a.textContent = '下载';
        a.href = downloadUrl(f.id);
        tdAct.appendChild(a);

        var detail = document.createElement('a');
        detail.className = 'dl';
        detail.style.marginLeft = '10px';
        detail.textContent = '详情';
        detail.onclick = function () { openDetail(f); };
        tdAct.appendChild(detail);
      }
      tr.appendChild(tdAct);

      tbody.appendChild(tr);
    });
  }

  function byName(a, b) {
    return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hans-CN', { numeric: true });
  }

  // ---------------------------------------------------------------- 数据
  function loadList(reset) {
    if (state.loading) return;
    state.loading = true;
    var current = state.stack[state.stack.length - 1];
    var offset = reset ? 0 : state.offset;
    setStatus('加载中…');
    $('load-more').disabled = true;

    api('/api/file/list', { parentId: current.id, pageSize: PAGE_SIZE, offset: offset })
      .then(function (data) {
        var files = data.files || [];
        if (reset) $('file-rows').innerHTML = '';
        renderRows(files);
        state.offset = offset + files.length;
        state.total = Number(data.total) || 0;
        state.hasMore = !!data.hasMore;
        $('load-more').hidden = !state.hasMore;
        setStatus(files.length === 0 && reset
          ? '这个目录是空的'
          : '共 ' + state.total + ' 项，已显示 ' + state.offset + ' 项');
      })
      .catch(function (e) { setStatus('加载失败：' + e.message); })
      .finally(function () {
        state.loading = false;
        $('load-more').disabled = false;
      });
  }

  function enterDir(f) {
    state.stack.push({ id: f.id, name: f.name || '(未命名)' });
    state.offset = 0;
    renderBreadcrumb();
    loadList(true);
  }

  function enterAt(index) {
    state.stack = state.stack.slice(0, index + 1);
    state.offset = 0;
    renderBreadcrumb();
    loadList(true);
  }

  function boot() {
    show('files');
    setStatus('加载中…');
    api('/api/space/get', {}).then(function (data) {
      var rootId = data.space && data.space.rootFileId;
      if (!rootId) throw new Error('服务端未配置用户根目录');
      state.rootId = rootId;
      state.stack = [{ id: rootId, name: '根目录' }];
      state.offset = 0;
      renderBreadcrumb();
      loadList(true);
    }).catch(function (e) {
      setStatus('加载失败：' + e.message);
    });
  }

  // ---------------------------------------------------------------- 文件详情 / 选择下载源
  // 与 App 的「文件详情页」对应：位置分布里每个已完成的位置都能单独下载。
  // 下载走 /api/file/stream/download 的 provider_id 参数（不传则由服务端按
  // sort_order 自动选源）；历史版本走 /api/file/history/download?id=<historyId>。
  var LOC_STATUS = {
    PPENDING: '待上传', PUPLOADING: '上传中', PCOMPLETED: '已完成',
    PFAILED: '失败', PDELETED_FAILED: '删除失败'
  };
  var CACHE_STATUS = { UNCACHED: '未缓存', CACHING: '缓存中', CACHED: '已缓存' };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  // 注意：文件名 / 路径都可能含特殊字符，一律用 textContent 写入，不要拼 innerHTML
  function downloadUrl(fileId, providerId) {
    var u = '/api/file/stream/download?file_id=' + encodeURIComponent(fileId) +
            '&token=' + encodeURIComponent(state.token);
    if (providerId !== undefined && providerId !== null && providerId !== '') {
      u += '&provider_id=' + encodeURIComponent(providerId);
    }
    return u;
  }

  function historyDownloadUrl(historyId) {
    return '/api/file/history/download?id=' + encodeURIComponent(historyId) +
           '&token=' + encodeURIComponent(state.token);
  }

  // ---------------------------------------------------------------- 直链（复制到剪贴板）
  // 直链是存储提供者签发的**临时凭证**，因此只写进剪贴板：不放进 DOM 文本 / href /
  // 浏览历史，也不打印到控制台。不满足直链条件（多分片 / 已加密 / 驱动不支持 /
  // 未启用）时后端返回 DIRECT_LINK_UNAVAILABLE，api() 会抛出 message 供提示。
  function copyDirectLink(fileId, providerId, node) {
    var body = { fileId: fileId };
    if (providerId !== undefined && providerId !== null && providerId !== '') {
      body.providerId = providerId;
    }
    node.textContent = '取直链…';
    api('/api/file/direct-link', body).then(function (data) {
      var url = data.url;
      if (!url) throw new Error('服务端未返回直链');
      return writeClipboard(url).then(function () {
        node.textContent = '已复制直链';
        var exp = data.expiresAt && String(data.expiresAt).indexOf('1970') !== 0
          ? fmtTime(data.expiresAt) : '';
        setStatus('直链已复制' + (exp ? '（有效期至 ' + exp + '）' : '') +
                  '，过期后重新复制即可；若下载报 403，请改用下载（代理）');
      });
    }).catch(function (e) {
      node.textContent = '复制直链';
      setStatus('该文件不支持直链，请用下载：' + e.message);
    });
  }

  // 剪贴板：优先 navigator.clipboard（仅 https / localhost 可用），
  // 否则退化到临时 textarea + execCommand（http 访问时 clipboard API 不存在）
  function writeClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { resolve(); } else { reject(new Error('浏览器拒绝写入剪贴板')); }
    });
  }

  // directLinkNode 生成"复制直链"节点（providerId 省略 = 由服务端自动选源）
  function directLinkNode(fileId, providerId) {
    var node = el('span', 'dl click', '复制直链');
    node.onclick = function () { copyDirectLink(fileId, providerId, node); };
    return node;
  }

  function closeDetail() {
    $('detail-overlay').hidden = true;
    $('detail-body').innerHTML = '';
  }

  // /api/file/detail 的 locations[].providerName 已是**存储实例名**
  // （storage_providers.name，如"我的本地盘"；provider 行被删时后端回退驱动类型名）。
  function openDetail(file) {
    $('detail-overlay').hidden = false;
    $('detail-title').textContent = file.name || '(未命名)';
    $('detail-body').textContent = '加载中…';
    api('/api/file/detail', { fileId: file.id })
      .then(function (data) { renderDetail(file, data); })
      .catch(function (e) { $('detail-body').textContent = '加载失败：' + e.message; });
  }

  function metaRow(dl, label, value) {
    dl.appendChild(el('dt', null, label));
    dl.appendChild(el('dd', null, value));
  }

  function renderDetail(file, data) {
    var f = data.file || file;
    var locations = data.locations || [];
    var histories = data.histories || [];
    var tags = data.tags || [];
    var body = $('detail-body');
    body.innerHTML = '';

    var meta = el('dl', 'meta');
    metaRow(meta, '大小', fmtSize(f.size));
    metaRow(meta, '类型', f.type || '-');
    metaRow(meta, '修改时间', fmtTime(f.updatedAt || f.createdAt));
    metaRow(meta, '哈希', f.hash ? String(f.hash).slice(0, 16) + '…' : '-');
    metaRow(meta, '就绪', f.isReady === false ? '否' : '是');
    if (f.mime) metaRow(meta, 'MIME', f.mime);
    if (tags.length) metaRow(meta, '标签', tags.join('、'));
    body.appendChild(meta);

    var quick = el('p');
    quick.appendChild(el('span', 'muted', '不指定源：'));
    var auto = el('a', 'dl', '自动选择源下载');
    auto.href = downloadUrl(f.id);
    quick.appendChild(auto);
    quick.appendChild(el('span', 'muted', ' · '));
    quick.appendChild(directLinkNode(f.id));
    body.appendChild(quick);

    // 位置分布：每个 PCOMPLETED 的位置都可单独下载
    var sec1 = el('div', 'section');
    sec1.appendChild(el('h3', null, '位置分布（' + locations.length + '）'));
    if (locations.length === 0) {
      sec1.appendChild(el('div', 'muted', '暂无位置信息'));
    } else {
      locations.forEach(function (loc) {
        var row = el('div', 'src');
        var done = loc.status === 'PCOMPLETED';
        // providerName 由后端给实例名（如"我的本地盘"），缺失时回退到 id
        row.appendChild(el('span', 'grow',
          loc.providerName || ('存储提供者 #' + loc.providerId)));
        row.appendChild(el('span', done ? 'ok' : 'muted', LOC_STATUS[loc.status] || '未知'));
        if (done) {
          var a = el('a', 'dl', '从此源下载');
          a.href = downloadUrl(f.id, loc.providerId);
          row.appendChild(a);
          row.appendChild(el('span', 'muted', ' · '));
          row.appendChild(directLinkNode(f.id, loc.providerId));
        }
        var bits = [];
        if (loc.size) bits.push('存储大小 ' + fmtSize(loc.size));
        if (loc.encrypted) bits.push('已加密');
        if (loc.isChunked) bits.push('分片 ×' + (loc.chunkTotal || '?'));
        if (loc.providerType === 'TELEGRAM' && loc.cacheStatus) {
          bits.push('缓存：' + (CACHE_STATUS[loc.cacheStatus] || loc.cacheStatus));
        }
        if (loc.storagePath) bits.push(loc.storagePath);
        if (bits.length) row.appendChild(el('span', 'sub', bits.join(' · ')));
        sec1.appendChild(row);
      });
    }
    body.appendChild(sec1);

    // 历史版本
    var sec2 = el('div', 'section');
    sec2.appendChild(el('h3', null, '历史版本（' + histories.length + '）'));
    if (histories.length === 0) {
      sec2.appendChild(el('div', 'muted', '无历史版本'));
    } else {
      histories.forEach(function (h) {
        var row = el('div', 'src');
        row.appendChild(el('span', 'grow',
          fmtTime(h.versionNumber || h.createdAt) + ' · ' + fmtSize(h.size)));
        var a = el('a', 'dl', '下载');
        a.href = historyDownloadUrl(h.id);
        row.appendChild(a);
        if (h.hash) row.appendChild(el('span', 'sub', 'hash ' + String(h.hash).slice(0, 16) + '…'));
        sec2.appendChild(row);
      });
    }
    body.appendChild(sec2);
  }

  // ---------------------------------------------------------------- 事件
  $('login-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = $('login-btn');
    var err = $('login-error');
    err.textContent = '';
    btn.disabled = true;
    login($('username').value.trim(), $('password').value)
      .then(function () { $('password').value = ''; boot(); })
      .catch(function (e) { err.textContent = e.message; })
      .finally(function () { btn.disabled = false; });
  });

  $('refresh-btn').addEventListener('click', function () { loadList(true); });
  $('logout-btn').addEventListener('click', function () { logout(false); });
  $('load-more').addEventListener('click', function () { loadList(false); });
  $('detail-close').addEventListener('click', closeDetail);
  // 点遮罩关闭（点弹层内部不关）
  $('detail-overlay').addEventListener('click', function (ev) {
    if (ev.target === this) closeDetail();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') closeDetail();
  });

  // ---------------------------------------------------------------- 启动
  if (state.token) { boot(); } else { show('login'); }
})();
</script>
</body>
</html>
